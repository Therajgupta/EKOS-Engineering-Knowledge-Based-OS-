# Deploy the Python API on Render (https://render.com)
# Frontend goes on Vercel/Netlify — set NEXT_PUBLIC_API_URL to this service URL.
services:
  - type: web
    name: ekos-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:3000"
